name: SingR Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.3.1"
        required: false
        default: "v0.3.1"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux, goos: linux, goarch: amd64, binname: singr, buildmode: exe, ldextra: "" }
          - { label: linux, goos: linux, goarch: arm64, binname: singr, buildmode: exe, ldextra: "" }
          # Android node box: GOOS stays linux (CGO_ENABLED=0 static, no NDK).
          # -buildmode=pie satisfies Android API 28+'s PIE requirement, and
          # `-I /system/bin/linker64` repoints PT_INTERP from glibc's ld.so
          # (absent on Android) to bionic's linker — without it exec fails with
          # a misleading "No such file or directory" on the missing interpreter.
          - { label: android, goos: linux, goarch: arm64, binname: libsingr.so, buildmode: pie, ldextra: "-I /system/bin/linker64" }
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache: true

      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
            if [[ -z "${VERSION}" ]]; then
              VERSION="v$(cat release/singr/VERSION)"
            fi
          fi
          if [[ "${VERSION}" != v* ]]; then
            VERSION="v${VERSION}"
          fi
          SINGR_VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "SINGR_VERSION=${SINGR_VERSION}" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          pkg="SingR-${{ matrix.label }}-${{ matrix.goarch }}"
          mkdir -p "dist/${pkg}"
          TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(cat release/LDFLAGS)"
          go build -v -trimpath \
            -buildmode=${{ matrix.buildmode }} \
            -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/poet/constant.Version=${SINGR_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid= ${{ matrix.ldextra }}" \
            -o "dist/${pkg}/${{ matrix.binname }}" \
            ./cmd/sing-box

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          pkg="SingR-${{ matrix.label }}-${{ matrix.goarch }}"
          package_dir="dist/${pkg}"
          cp README.md "${package_dir}/"
          cp release/poet/panel_anytls.json "${package_dir}/panel.json"
          cp release/poet/server_anytls.json "${package_dir}/server.json"
          printf '%s\n' "${SINGR_VERSION}" > "${package_dir}/VERSION"
          chmod +x "${package_dir}/${{ matrix.binname }}"
          (
            cd dist
            tar -czf "${pkg}.tar.gz" "${pkg}"
            sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"
            zip -9 -r "${pkg}.zip" "${pkg}"
            sha256sum "${pkg}.zip" > "${pkg}.zip.sha256"
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SingR-${{ matrix.label }}-${{ matrix.goarch }}
          path: |
            dist/SingR-${{ matrix.label }}-${{ matrix.goarch }}.tar.gz
            dist/SingR-${{ matrix.label }}-${{ matrix.goarch }}.tar.gz.sha256
            dist/SingR-${{ matrix.label }}-${{ matrix.goarch }}.zip
            dist/SingR-${{ matrix.label }}-${{ matrix.goarch }}.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Could not resolve release version (no tag, no workflow input)"
            exit 1
          fi
          if [[ "${VERSION}" != v* ]]; then
            VERSION="v${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release create "${VERSION}" \
              --title "SingR ${VERSION}" \
              --notes "SingR ${VERSION}"
          fi
          gh release upload "${VERSION}" dist/* --clobber
