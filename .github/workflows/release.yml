name: SingR Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.3.1"
        required: false
        default: "v0.3.1"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux, goos: linux, goarch: amd64, binname: singr, buildmode: exe, ldextra: "" }
          - { label: linux, goos: linux, goarch: arm64, binname: singr, buildmode: exe, ldextra: "" }
          # The Android node used to ship as a standalone CGO_ENABLED=0 PIE
          # (libsingr.so). That binary can't run on modern Android (netlink route
          # monitoring is sandboxed) so it's replaced by the gomobile AAR built in
          # the build_android_aar job below, which the app embeds via libbox.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.7"
          cache: true

      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
            if [[ -z "${VERSION}" ]]; then
              VERSION="v$(cat release/singr/VERSION)"
            fi
          fi
          if [[ "${VERSION}" != v* ]]; then
            VERSION="v${VERSION}"
          fi
          SINGR_VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "SINGR_VERSION=${SINGR_VERSION}" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          pkg="SingR-${{ matrix.label }}-${{ matrix.goarch }}"
          mkdir -p "dist/${pkg}"
          TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(cat release/LDFLAGS)"
          go build -v -trimpath \
            -buildmode=${{ matrix.buildmode }} \
            -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/poet/constant.Version=${SINGR_VERSION}' ${LDFLAGS_SHARED} -s -w -buildid= ${{ matrix.ldextra }}" \
            -o "dist/${pkg}/${{ matrix.binname }}" \
            ./cmd/sing-box

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          pkg="SingR-${{ matrix.label }}-${{ matrix.goarch }}"
          package_dir="dist/${pkg}"
          cp README.md "${package_dir}/"
          cp release/poet/panel_anytls.json "${package_dir}/panel.json"
          cp release/poet/server_anytls.json "${package_dir}/server.json"
          printf '%s\n' "${SINGR_VERSION}" > "${package_dir}/VERSION"
          chmod +x "${package_dir}/${{ matrix.binname }}"
          (
            cd dist
            tar -czf "${pkg}.tar.gz" "${pkg}"
            sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"
            zip -9 -r "${pkg}.zip" "${pkg}"
            sha256sum "${pkg}.zip" > "${pkg}.zip.sha256"
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: SingR-${{ matrix.label }}-${{ matrix.goarch }}
          path: |
            dist/SingR-${{ matrix.label }}-${{ matrix.goarch }}.tar.gz
            dist/SingR-${{ matrix.label }}-${{ matrix.goarch }}.tar.gz.sha256
            dist/SingR-${{ matrix.label }}-${{ matrix.goarch }}.zip
            dist/SingR-${{ matrix.label }}-${{ matrix.goarch }}.zip.sha256
          if-no-files-found: error

  build_android_aar:
    name: Build Android AAR (libbox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Keep gomobile on the same pinned stable Go toolchain as the Linux release.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.7"
          cache: true

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Setup OpenJDK
        run: sudo apt update && sudo apt install -y openjdk-17-jdk-headless

      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
            if [[ -z "${VERSION}" ]]; then
              VERSION="v$(cat release/singr/VERSION)"
            fi
          fi
          if [[ "${VERSION}" != v* ]]; then
            VERSION="v${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          # build_libbox/gomobile stamps the version from the git tag.
          git tag -f "${VERSION}"

      - name: Build AAR
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android_arm64
          unzip -Z1 libbox.aar | grep -qx 'jni/arm64-v8a/libbox.so'
          if unzip -Z1 libbox.aar | grep -Eq '^jni/(armeabi-v7a|x86|x86_64)/'; then
            echo "::error::Android release AAR contains an unexpected non-arm64 ABI"
            exit 1
          fi
          test -f libbox.aar

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp libbox.aar "dist/SingR-android.aar"
          ( cd dist && sha256sum "SingR-android.aar" > "SingR-android.aar.sha256" )

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: SingR-android-aar
          path: |
            dist/SingR-android.aar
            dist/SingR-android.aar.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
      - build_android_aar
    steps:
      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Could not resolve release version (no tag, no workflow input)"
            exit 1
          fi
          if [[ "${VERSION}" != v* ]]; then
            VERSION="v${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release create "${VERSION}" \
              --title "SingR ${VERSION}" \
              --notes "SingR ${VERSION}"
          fi
          gh release upload "${VERSION}" dist/* --clobber
