name: SingR

# SingR 自有部分的检查。上游的 test.yml / lint.yml 只在 stable/testing/unstable/
# oldstable 分支触发，main 上不跑；这个 workflow 补上这块。它是 SingR 新增的文件，
# 不与上游冲突，核心同步时保留即可。
#
# 检查内容都在 scripts/test-all.sh 里，本地跑 `bash scripts/test-all.sh` 等价。

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq openssl python3 curl
      - name: Generated scripts and shell regression tests
        run: bash scripts/test-all.sh shell

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 与 release.yml / Dockerfile 一致：跟随上游 sing-box 自己构建用的版本。
          go-version: "1.26.10"
      - name: Vet and test SingR packages
        run: bash scripts/test-all.sh go
