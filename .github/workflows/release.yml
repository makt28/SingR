name: SingR Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.8"
        required: false
        default: "v0.1.8"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache: true

      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
            if [[ -z "${VERSION}" ]]; then
              VERSION="v$(cat release/singr/VERSION)"
            fi
          fi
          if [[ "${VERSION}" != v* ]]; then
            VERSION="v${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "dist/SingR-linux-${{ matrix.arch }}"
          TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(cat release/LDFLAGS)"
          go build -v -trimpath \
            -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o "dist/SingR-linux-${{ matrix.arch }}/singr" \
            ./cmd/sing-box

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/SingR-linux-${{ matrix.arch }}"
          cp README.md "${package_dir}/"
          cp release/poet/panel_anytls.json "${package_dir}/panel.json"
          cp release/poet/server_anytls.json "${package_dir}/server.json"
          cp release/singr/VERSION "${package_dir}/VERSION"
          chmod +x "${package_dir}/singr"
          (
            cd dist
            zip -9 -r "SingR-linux-${{ matrix.arch }}.zip" "SingR-linux-${{ matrix.arch }}"
            sha256sum "SingR-linux-${{ matrix.arch }}.zip" > "SingR-linux-${{ matrix.arch }}.zip.sha256"
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SingR-linux-${{ matrix.arch }}
          path: |
            dist/SingR-linux-${{ matrix.arch }}.zip
            dist/SingR-linux-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
            if [[ -z "${VERSION}" ]]; then
              VERSION="v$(cat release/singr/VERSION)"
            fi
          fi
          if [[ "${VERSION}" != v* ]]; then
            VERSION="v${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add release helper assets
        shell: bash
        run: |
          set -euo pipefail
          cp release/singr/VERSION dist/VERSION
          git archive --format=tar.gz --prefix="SingR-${VERSION#v}/" \
            -o "dist/SingR-source-${VERSION}.tar.gz" HEAD
          (
            cd dist
            sha256sum VERSION > VERSION.sha256
            sha256sum "SingR-source-${VERSION}.tar.gz" > "SingR-source-${VERSION}.tar.gz.sha256"
          )

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release create "${VERSION}" \
              --title "SingR ${VERSION}" \
              --notes "SingR ${VERSION}"
          fi
          gh release upload "${VERSION}" dist/* --clobber
